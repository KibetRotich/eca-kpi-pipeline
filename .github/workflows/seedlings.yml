name: Seedlings Dashboard Refresh

# Keeps masp4-platform/public/Seedlings_Dashboard.html (served at
# /Seedlings_Dashboard.html) in sync with the live Kobo form. Re-pulls ALL
# submissions from KoBoToolbox and rebuilds the self-contained dashboard, then
# commits it — which triggers a Vercel deploy of ecadata.solidaridadnetwork.org.
#
# MIGRATED from solidaridad-eca/masp4-platform (2026-08-14). This repo is the one
# Vercel actually deploys from, so the rebuilt dashboard now reaches production
# without a manual sync. In this repo the app lives in the masp4-platform/
# subfolder, so every `run` step sets working-directory: masp4-platform — that
# makes CWD identical to the old repo root, so the pipeline scripts (which resolve
# paths from __file__) write to masp4-platform/public/ unchanged.
#
# Triggers:
#   1. Nightly at 03:00 UTC (06:00 EAT) — picks up new submissions / new species
#   2. On push to the pipeline source files (rebuild after a code change)
#   3. Manual run from the Actions tab (Actions → Run workflow)
#
# Required secret:  KOBO_TOKEN  (Settings → Secrets and variables → Actions)
#   KoBoToolbox API token for the form (UID a5rJdqQGuy2DtTXvEx3cpq).
#   Until it is set, the job skips cleanly (green) instead of failing nightly.
on:
  schedule:
    - cron: "0 3 * * *"      # 03:00 UTC daily
  push:
    paths:
      - "masp4-platform/pipeline/seedlings/**"
      - ".github/workflows/seedlings.yml"
  workflow_dispatch:

concurrency:
  group: seedlings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch Kobo data → rebuild dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}

    steps:
      # Gate the job on the secret being present so pushes don't fail before it is
      # configured. Secrets can't be used in a job-level `if`, so steps are gated
      # on this output instead. No working-directory here: this runs before
      # checkout, when masp4-platform/ does not yet exist.
      - name: Check required secrets
        id: check
        run: |
          if [ -n "$KOBO_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Seedlings refresh skipped — KOBO_TOKEN not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: masp4-platform/pipeline/seedlings/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: pip install -r pipeline/seedlings/requirements.txt

      # 1. Pull every submission into pipeline/seedlings/seedlings_*.csv
      #    (gitignored — rebuilt every run, never committed)
      - name: Fetch Kobo submissions
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: python pipeline/seedlings/fetch_seedlings_json.py

      # 2. Rebuild the dashboard into masp4-platform/public/. Species & district
      #    lists are data-driven, so new species / districts flow through
      #    automatically. Any district name that fails to match a boundary is
      #    printed here.
      - name: Rebuild dashboard
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: python pipeline/seedlings/build_dashboard.py

      # 3. Commit the regenerated dashboard. Only commits when the file actually
      #    changed (quiet days → no commit/deploy). Rebase-and-retry on push so a
      #    concurrent commit to main (e.g. the ETL run) doesn't fail the run with a
      #    non-fast-forward. The push triggers Vercel to redeploy the platform.
      - name: Commit updated dashboard
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: |
          if git diff --quiet -- public/Seedlings_Dashboard.html; then
            echo "No dashboard changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/Seedlings_Dashboard.html
          git commit -m "chore: seedlings dashboard refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "::error::push failed after $n attempts"; exit 1; fi
            echo "push rejected (main moved); rebasing — attempt $n"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" \
              || { echo "::error::rebase conflict on generated dashboard"; git rebase --abort; exit 1; }
          done
