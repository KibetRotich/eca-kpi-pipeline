name: Tree-Survival Dashboards Refresh

# Keeps the two SEPARATE tree-survival dashboards in sync with the live Kobo forms:
#   masp4-platform/public/HC_Survival_UG_Dashboard.html   (Harvesting Carbon — Uganda)
#   masp4-platform/public/SAVE_KE_Survival_Dashboard.html (SAVE KE — Kenya)
# Flow: fetch Kobo (JSON, preserves Form 2 repeat) -> defensive clean/transform
#       -> upsert Supabase (hcs_* tables) -> rebuild dashboards -> commit (triggers deploy).
#
# MIGRATED from solidaridad-eca/masp4-platform (2026-08-14). This repo is the one
# Vercel deploys from. The app lives in the masp4-platform/ subfolder here, so each
# `run` step sets working-directory: masp4-platform, making CWD identical to the old
# repo root — the pipeline scripts resolve paths from __file__ and so write to
# masp4-platform/public/ unchanged.
#
# NOTE: this pipeline was already stalled before the migration — the last hcs_*
# Supabase write was 2026-07-20 and the last dashboard commit 2026-07-21, despite the
# nightly schedule. Moving it here does not by itself fix that; the first green run
# after secrets are configured is what will show the real failure (if any).
#
# Triggers: nightly 03:20 UTC, on pipeline source change, or manual.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   KOBO_TOKEN                    KoBoToolbox API token (both forms)
#   NEXT_PUBLIC_SUPABASE_URL      Supabase project URL (MASPIV_Platform)
#   SUPABASE_SERVICE_ROLE_KEY     Supabase service role key (server-side only)
#   Until all three are set, the job skips cleanly (green) instead of failing nightly.
on:
  schedule:
    - cron: "20 3 * * *"      # 03:20 UTC daily (06:20 EAT) — offset from seedlings
  push:
    paths:
      - "masp4-platform/pipeline/hc_survival/**"
      - ".github/workflows/hc_survival.yml"
  workflow_dispatch:

concurrency:
  group: hc-survival-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch Kobo → clean → Supabase → rebuild dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      # Gate the job on the secrets being present so pushes don't fail before they
      # are configured. Runs before checkout, so no working-directory here —
      # masp4-platform/ does not exist yet.
      - name: Check required secrets
        id: check
        run: |
          if [ -n "$KOBO_TOKEN" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tree-survival refresh skipped — KOBO_TOKEN / NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not all set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: masp4-platform/pipeline/hc_survival/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: pip install -r pipeline/hc_survival/requirements.txt

      # 1. Pull all submissions for both forms (JSON, gitignored)
      - name: Fetch Kobo submissions
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: python pipeline/hc_survival/fetch_survival_json.py

      # 2. Defensive clean/normalize -> clean_*.json
      - name: Transform (defensive clean)
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: python pipeline/hc_survival/transform.py

      # 3. Upsert raw + normalized rows into Supabase (hcs_* tables), idempotent
      - name: Load Supabase
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: python pipeline/hc_survival/load_supabase.py

      # 4. Rebuild both self-contained dashboards into masp4-platform/public/
      - name: Rebuild dashboards
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: python pipeline/hc_survival/build_dashboard.py

      # 5. Commit regenerated dashboards (only when changed). Push triggers Vercel deploy.
      - name: Commit updated dashboards
        if: steps.check.outputs.ready == 'true'
        working-directory: masp4-platform
        run: |
          if git diff --quiet -- public/HC_Survival_UG_Dashboard.html public/SAVE_KE_Survival_Dashboard.html; then
            echo "No dashboard changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/HC_Survival_UG_Dashboard.html public/SAVE_KE_Survival_Dashboard.html
          git commit -m "chore: tree-survival dashboards refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "::error::push failed after $n attempts"; exit 1; fi
            echo "push rejected (main moved); rebasing — attempt $n"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" \
              || { echo "::error::rebase conflict on generated dashboard"; git rebase --abort; exit 1; }
          done
