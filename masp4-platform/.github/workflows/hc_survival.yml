name: Tree-Survival Dashboards Refresh

# Keeps the two SEPARATE tree-survival dashboards in sync with the live Kobo forms:
#   public/HC_Survival_UG_Dashboard.html   (Harvesting Carbon — Uganda)
#   public/SAVE_KE_Survival_Dashboard.html (SAVE KE — Kenya)
# Flow: fetch Kobo (JSON, preserves Form 2 repeat) -> defensive clean/transform
#       -> upsert Supabase (hcs_* tables) -> rebuild dashboards -> commit (triggers deploy).
#
# Triggers: nightly 03:20 UTC, on pipeline source change, or manual.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   KOBO_TOKEN                    KoBoToolbox API token (both forms)
#   NEXT_PUBLIC_SUPABASE_URL      Supabase project URL (MASPIV_Platform)
#   SUPABASE_SERVICE_ROLE_KEY     Supabase service role key (server-side only)
on:
  schedule:
    - cron: "20 3 * * *"      # 03:20 UTC daily (06:20 EAT) — offset from seedlings
  push:
    paths:
      - "pipeline/hc_survival/**"
      - ".github/workflows/hc_survival.yml"
  workflow_dispatch:

concurrency:
  group: hc-survival-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch Kobo → clean → Supabase → rebuild dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/hc_survival/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/hc_survival/requirements.txt

      # 1. Pull all submissions for BOTH forms + Form 2 definition (JSON, gitignored)
      - name: Fetch Kobo submissions
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: python pipeline/hc_survival/fetch_survival_json.py

      # 2. Defensive clean/reshape -> clean_submissions.json + clean_species.json
      - name: Transform (defensive clean)
        run: python pipeline/hc_survival/transform.py

      # 3. Upsert raw + clean into Supabase (hcs_raw_submissions / hcs_submissions / hcs_species)
      - name: Load Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipeline/hc_survival/load_supabase.py

      # 4. Rebuild both self-contained dashboards into public/
      - name: Rebuild dashboards
        run: python pipeline/hc_survival/build_dashboard.py

      # 5. Commit regenerated dashboards (only when changed). Push triggers Vercel deploy.
      - name: Commit updated dashboards
        run: |
          if git diff --quiet -- public/HC_Survival_UG_Dashboard.html public/SAVE_KE_Survival_Dashboard.html; then
            echo "No dashboard changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/HC_Survival_UG_Dashboard.html public/SAVE_KE_Survival_Dashboard.html
          git commit -m "chore: tree-survival dashboards refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then echo "::error::push failed after $n attempts"; exit 1; fi
            echo "push rejected (main moved); rebasing — attempt $n"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" \
              || { echo "::error::rebase conflict on generated dashboard"; git rebase --abort; exit 1; }
          done
