<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>__TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--g:#2e7d32;--g2:#1b5e20;--accent:#e65100;--bg:#eef0ee;--card:#fff;--ink:#222;--mut:#6b6b6b;--bd:#d8d8d8;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--g);color:#fff;padding:12px 22px;display:flex;align-items:baseline;gap:14px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--g2)}
  header h1{font-size:17px;margin:0;font-weight:800}
  header .sub{font-size:12px;opacity:.85}
  .wrap{display:flex;min-height:calc(100vh - 48px)}
  nav{width:210px;background:#fff;border-right:1px solid var(--bd);padding:10px 0;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto;flex:none}
  nav a{display:block;padding:10px 18px;color:var(--ink);text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
  nav a:hover{background:#f1f8f1}
  nav a.active{border-left-color:var(--g);background:#f1f8f1;font-weight:700;color:var(--g2)}
  main{flex:1;padding:18px 24px;max-width:1500px}
  section{display:none}
  section.show{display:block}
  .sec-title{font-size:19px;font-weight:800;color:var(--g2);margin:4px 0 2px}
  .sec-desc{color:var(--mut);font-size:13px;margin-bottom:14px;max-width:900px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .block{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .block.full{grid-column:1/-1}
  .block h3{margin:0 0 10px;font-size:14px;font-weight:650}
  .note{color:var(--mut);font-size:11.5px;margin-top:8px;line-height:1.5}
  .chartbox{position:relative;height:300px}
  .kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .kpi{flex:1;min-width:140px;background:#f4faf4;border:1px solid var(--bd);border-top:3px solid var(--g);border-radius:8px;padding:12px 14px}
  .kpi .v{font-size:23px;font-weight:800;color:var(--g2)}
  .kpi .l{font-size:11.5px;color:var(--mut);margin-top:3px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}
  th{background:#f5f5f5;font-weight:650}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-bottom:16px}
  .filters label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}
  .filters select{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font-size:13px;min-width:150px}
  .filters button{padding:7px 14px;border:0;background:var(--g);color:#fff;font-weight:600;border-radius:6px;cursor:pointer;font-size:13px}
  .filters button:hover{background:var(--g2)}
  .card{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--g);border-radius:8px;padding:12px 14px;margin-bottom:12px}
  .card.warn{border-left-color:var(--accent)}
  .card h4{margin:0 0 4px;font-size:13.5px}
  .card p{margin:0;font-size:12.5px;color:#444;line-height:1.55}
  .pill{display:inline-block;background:#eafaea;border:1px solid #cbe8cb;border-radius:20px;padding:2px 9px;font-size:11px;margin:2px}
  .footer{color:var(--mut);font-size:11px;margin-top:26px;padding-top:12px;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<header><h1>__H1__</h1><span class="sub" id="hdrsub"></span></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const DATA = /*__DATA__*/;
const PAL=["#2e7d32","#66bb6a","#1565c0","#e65100","#7b1fa2","#00838f","#c62828","#9e9d24","#ad1457","#4527a0"];
const charts={};
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const pct=x=>x==null||isNaN(x)?"–":(100*x).toFixed(1)+"%";
const fmt=n=>n==null?"–":Math.round(n).toLocaleString();

// survival = sum(alive)/sum(planted) over rows grouped by key(row); returns [{k,sr,n,planted}]
function surv(rows,key,minn){
  const g={};
  rows.forEach(r=>{const k=key(r); if(k==null||k==="")return; (g[k]=g[k]||{a:0,p:0,n:0}); g[k].a+=(+r.alive||0);g[k].p+=(+r.planted||0);g[k].n++;});
  return Object.entries(g).map(([k,v])=>({k,sr:v.p>0?v.a/v.p:null,n:v.n,planted:v.p}))
    .filter(d=>d.n>=(minn||1)&&d.sr!=null).sort((a,b)=>a.sr-b.sr);
}
function poolSurv(rows){let a=0,p=0;rows.forEach(r=>{a+=(+r.alive||0);p+=(+r.planted||0)});return p>0?a/p:null;}
function estRate(rows){let p=0,c=0;rows.forEach(r=>{p+=(+r.planted||0);c+=(+r.collected||0)});return c>0?p/c:null;}
function distinct(rows,f){return new Set(rows.map(f).filter(x=>x!=null)).size;}

function barChart(id,rows,{label,color,horizontal,fmtv}={}){
  const ctx=$("#"+id); if(!ctx)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(ctx,{type:"bar",data:{labels:rows.map(r=>r.k),
    datasets:[{label:label||"Survival",data:rows.map(r=>r.sr!=null?+(100*r.sr).toFixed(1):r.v),
      backgroundColor:rows.map((r,i)=>color||(r.sr!=null?(r.sr<0.5?"#c62828":r.sr<0.6?"#e65100":"#2e7d32"):PAL[i%PAL.length]))}]},
    options:{indexAxis:horizontal?"y":"x",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed[horizontal?'x':'y']}%  (n=${rows[c.dataIndex].n||''})`}}},
      scales:{[horizontal?"x":"y"]:{beginAtZero:true,max:100,ticks:{callback:v=>v+"%"}}}}});
}
function lineChart(id,rows){
  const ctx=$("#"+id);if(!ctx)return; if(charts[id])charts[id].destroy();
  charts[id]=new Chart(ctx,{type:"line",data:{labels:rows.map(r=>r.k),
    datasets:[{data:rows.map(r=>+(100*r.sr).toFixed(1)),borderColor:"#1565c0",backgroundColor:"#1565c0",tension:.25,fill:false,pointRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+"%"}}}}});
}

// ---- filtering ----
function applyFilters(){
  const f={};
  DATA.filters.forEach(fl=>{const v=$("#f_"+fl.id).value; if(v)f[fl.id]=v;});
  const match=r=>DATA.filters.every(fl=>!f[fl.id]||String(r[fl.field])===f[fl.id]);
  const rows=DATA.records.filter(match);
  const sp=(DATA.species||[]).filter(match);
  renderOverview(rows,sp);
}
function renderOverview(rows,sp){
  // KPI tiles
  const k=$("#kpis"); k.innerHTML="";
  const tiles=[["Seedling survival",pct(poolSurv(rows))],["Establishment rate",pct(estRate(rows))],
    ["Submissions",fmt(rows.length)],["Farmers",fmt(distinct(rows,r=>r.farmer_id))],
    ["Total planted",fmt(rows.reduce((s,r)=>s+(+r.planted||0),0))],
    ["GPS in-bounds",pct(rows.filter(r=>r.gps_ok===true).length/Math.max(rows.filter(r=>r.gps_ok!=null).length,1))]];
  if(DATA.cohort==="UG_HC"){const cp=rows.reduce((s,r)=>s+(+r.coffee_planted||0),0),ca=rows.reduce((s,r)=>s+(+r.coffee_alive||0),0);
    tiles.push(["Coffee survival",pct(cp>0?ca/cp:null)]);}
  tiles.forEach(([l,v])=>{const e=el("div","kpi");e.appendChild(el("div","v",v));e.appendChild(el("div","l",l));k.appendChild(e);});
  // charts
  const speciesRows=DATA.cohort==="KE_SAVE"?sp:rows;
  const spKey=DATA.cohort==="KE_SAVE"?(r=>r.species):(r=>r.species_taken);
  barChart("c_species",surv(speciesRows,spKey,DATA.cohort==="KE_SAVE"?50:8).slice(-12),{horizontal:true});
  barChart("c_loc",surv(rows,r=>r.loc,5),{horizontal:true});
  barChart("c_transport",surv(rows,r=>r.transport,10),{horizontal:true});
  const order=["Very poor","Very Poor","Poor","Same","Good","Very Good"];
  barChart("c_growth",surv(rows,r=>r.growth,5).sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k)));
  if(DATA.cohort==="KE_SAVE"){const wv=surv(sp,r=>r.wave,20).sort((a,b)=>a.k.localeCompare(b.k));lineChart("c_wave",wv);}
}

// ---- static sections ----
function renderStatic(){
  // loss reasons
  const lb=$("#c_loss"); if(lb&&DATA.loss_reasons){barChart("c_loss",DATA.loss_reasons.map(d=>({k:d.label,v:d.pct,n:d.n})),{color:"#e65100"});}
  // env block (KE) / coffee (UG)
  if(DATA.env_block){const e=$("#c_env"); if(e)barChart("c_env",DATA.env_block.map(d=>({k:d.label,v:d.pct,n:d.n})),{color:"#1565c0"});}
  // insights cards
  const ic=$("#insights"); if(ic){DATA.insights.forEach(c=>{const d=el("div","card"+(c.warn?" warn":""));d.appendChild(el("h4",null,c.title));d.appendChild(el("p",null,c.body));ic.appendChild(d);});}
  // DQ table
  const dq=$("#dqtable"); if(dq&&DATA.dq){let h="<tr><th>Check</th><th class=num>Value</th><th>Note</th></tr>";
    DATA.dq.forEach(r=>h+=`<tr><td>${r.check}</td><td class=num>${r.value}</td><td>${r.note||""}</td></tr>`);dq.innerHTML=h;}
}

// ---- layout ----
function build(){
  $("#hdrsub").textContent=DATA.subtitle;
  const nav=$("#nav"),main=$("#main");
  DATA.sections.forEach((s,i)=>{
    const a=el("a",i===0?"active":"",s.title);a.onclick=()=>{document.querySelectorAll("nav a").forEach(x=>x.classList.remove("active"));a.classList.add("active");document.querySelectorAll("section").forEach(x=>x.classList.remove("show"));$("#sec_"+s.id).classList.add("show");Object.values(charts).forEach(c=>{try{c.resize()}catch(e){}});};
    nav.appendChild(a);
    const sec=el("section",i===0?"show":"");sec.id="sec_"+s.id;sec.appendChild(el("div","sec-title",s.title));if(s.desc)sec.appendChild(el("div","sec-desc",s.desc));sec.insertAdjacentHTML("beforeend",s.html);main.appendChild(sec);
  });
  // filters UI
  const fr=$("#filters");
  if(fr){DATA.filters.forEach(fl=>{const w=el("div");w.appendChild(el("label",null,fl.label));const s=el("select");s.id="f_"+fl.id;s.appendChild(el("option",null,"All"));fl.options.forEach(o=>{const op=el("option",null,o);op.value=o;s.appendChild(op);});s.onchange=applyFilters;w.appendChild(s);fr.appendChild(w);});
    const b=el("button",null,"Reset");b.onclick=()=>{DATA.filters.forEach(fl=>$("#f_"+fl.id).value="");applyFilters();};fr.appendChild(b);}
  renderStatic();
  applyFilters();
}
build();
</script>
</body>
</html>
