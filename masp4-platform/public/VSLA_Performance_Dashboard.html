<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VSLA Performance Assessment — Insights Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--g:#2e7d32;--g2:#1b5e20;--accent:#e65100;--blue:#1565c0;--bg:#eef0ee;--card:#fff;--ink:#222;--mut:#6b6b6b;--bd:#d8d8d8;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--g);color:#fff;padding:12px 22px;display:flex;align-items:baseline;gap:14px;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--g2)}
  header h1{font-size:17px;margin:0;font-weight:800}
  header .sub{font-size:12px;opacity:.85}
  .wrap{display:flex;min-height:calc(100vh - 48px)}
  nav{width:216px;background:#fff;border-right:1px solid var(--bd);padding:10px 0;position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto;flex:none}
  nav a{display:block;padding:10px 18px;color:var(--ink);text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
  nav a:hover{background:#f1f8f1}
  nav a.active{border-left-color:var(--g);background:#f1f8f1;font-weight:700;color:var(--g2)}
  main{flex:1;padding:16px 22px;max-width:1560px}
  .sec-title{font-size:19px;font-weight:800;color:var(--g2);margin:2px 0 2px}
  .sec-desc{color:var(--mut);font-size:13px;margin-bottom:12px;max-width:960px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .block{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .block.full{grid-column:1/-1}
  .block h3{margin:0 0 8px;font-size:13.5px;font-weight:700}
  .note{color:var(--mut);font-size:11.5px;margin-top:8px;line-height:1.5}
  .chartbox{position:relative;height:290px}
  .chartbox.tall{height:520px}
  .kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .kpi{flex:1;min-width:135px;background:#f4faf4;border:1px solid var(--bd);border-top:3px solid var(--g);border-radius:8px;padding:11px 13px}
  .kpi .v{font-size:21px;font-weight:800;color:var(--g2)}
  .kpi .l{font-size:11px;color:var(--mut);margin-top:3px}
  .kpi .sub{font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.5}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left}
  th{background:#f5f5f5;font-weight:650;position:sticky;top:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tablebox{max-height:460px;overflow:auto}
  .hm{overflow:auto}
  .hm td{text-align:center;font-size:11px;border:1px solid #fff;min-width:42px}
  .hm th{font-size:10.5px;font-weight:600}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:14px;position:sticky;top:48px;z-index:20}
  .filters label{font-size:10.5px;color:var(--mut);display:block;margin-bottom:3px}
  .filters select,.filters input{padding:5px 7px;border:1px solid var(--bd);border-radius:6px;font-size:12.5px;min-width:118px;max-width:190px}
  .filters button{padding:6px 12px;border:0;background:var(--g);color:#fff;font-weight:600;border-radius:6px;cursor:pointer;font-size:12.5px}
  .filters button:hover{background:var(--g2)}
  .filters .fnote{font-size:10.5px;color:var(--mut);margin-left:auto;align-self:center;max-width:230px}
  .pill{display:inline-block;background:#eafaea;border:1px solid #cbe8cb;border-radius:20px;padding:2px 9px;font-size:11px;margin:2px}
  .footer{color:var(--mut);font-size:11px;margin-top:24px;padding-top:12px;border-top:1px solid var(--bd)}
  .clickable{cursor:pointer}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:700}
  .badge.p{background:#f8d7da;color:#a31515}
  .badge.f{background:#fff3e0;color:#e65100}
  /* qualitative panel */
  .qbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
  .qbar input[type=text]{padding:6px 9px;border:1px solid var(--bd);border-radius:6px;font-size:12.5px;min-width:240px}
  .qbar select{padding:6px 9px;border:1px solid var(--bd);border-radius:6px;font-size:12.5px}
  .exlist{max-height:620px;overflow:auto;display:flex;flex-direction:column;gap:9px}
  .excerpt{border:1px solid var(--bd);border-left:3px solid var(--g);border-radius:8px;padding:9px 12px;background:#fff}
  .excerpt.sens{border-left-color:var(--accent);background:#fffaf5}
  .excerpt .q{font-size:12px;font-weight:700;color:var(--g2)}
  .excerpt .ctx{font-size:10.5px;color:var(--mut);margin-top:2px}
  .excerpt .txt{font-size:12.5px;margin-top:6px;line-height:1.5;color:var(--ink)}
  .excerpt .snote{font-size:10.5px;color:var(--accent);margin-top:4px;font-style:italic}
  /* exploratory-insight cards (Performance Ratios tab) */
  .insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
  .insight{border:1px solid #ececec;border-radius:8px;padding:9px 11px;background:#f7fbff}
  .insight.skip{background:#fafafa}
  .insight .il{font-size:12px;font-weight:700;color:var(--g2);margin-bottom:4px}
  .insight .is{font-size:12px;color:var(--ink);margin-bottom:6px;line-height:1.45}
  .insight .ic{font-size:11px;color:#8a5a00;background:#fff7e6;border:1px solid #ffe2a8;border-radius:5px;padding:4px 6px}
  /* drill-down overlay */
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
  #ov .panel{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:min(1000px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  #ov h3{margin:0 0 8px;font-size:15px;color:var(--g2)}
  #ov .close{position:sticky;top:0;float:right;border:0;background:var(--accent);color:#fff;border-radius:6px;padding:5px 11px;font-weight:700;cursor:pointer}
</style>
</head>

// ── global filter state ──────────────────────────────────────
const F={sc:null,pa:null,vi:null,from:null,to:null};
function filtered(){
  return GROUPS.filter(g=>
    (F.sc==null||g.sub_county===F.sc)&&(F.pa==null||g.parish===F.pa)&&(F.vi==null||g.village===F.vi)&&
    (F.from==null||(g.assessment_date&&g.assessment_date>=F.from))&&
    (F.to==null||(g.assessment_date&&g.assessment_date<=F.to)));
}

// ── aggregation helpers ──────────────────────────────────────
const mval=g=>g.metrics||{};
function mean(arr){const v=arr.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function median(arr){const v=arr.filter(x=>x!=null&&!isNaN(x)).sort((a,b)=>a-b);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;}
function sumM(rows,k){let s=0,any=false;rows.forEach(g=>{const v=mval(g)[k];if(v!=null&&!isNaN(v)){s+=v;any=true;}});return any?s:null;}
function meanM(rows,k){return mean(rows.map(g=>{const v=mval(g)[k];return v==null||isNaN(v)?null:v;}));}
// boolean tri-state: {yes,no,unk,pct}
function boolT(rows,k){let y=0,n=0,u=0;rows.forEach(g=>{const v=mval(g)[k];v===true?y++:v===false?n++:u++;});return {yes:y,no:n,unk:u,pct:(y+n)?100*y/(y+n):null};}
// performance ratios (ratios.py / lib/analytics/ratios.ts) live alongside .metrics
const rval=g=>g.ratios||{};
function ratioVals(rows,k){return rows.map(g=>{const v=rval(g)[k];return v==null||isNaN(v)?null:v;});}
function medR(rows,k){return median(ratioVals(rows,k));}
function ratioRanked(rows,k){return rows.filter(g=>rval(g)[k]!=null).sort((a,b)=>rval(b)[k]-rval(a)[k]);}
function tally(rows,keyfn){const m=new Map();rows.forEach(r=>{const k=keyfn(r);if(k==null||k==="")return;m.set(k,(m.get(k)||0)+1);});return m;}
function topEntries(map,n){return [...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n);}

// meeting-frequency normaliser (free-text field is noisy)
function normFreq(s){if(!s)return "Unknown";const t=String(s).toLowerCase();
  if(t.includes("twice"))return "Biweekly";
  if(t.includes("week")&&(t.includes("2")||t.includes("two")||t.includes("bi")||t.includes("fortnight")))return "Biweekly";
  if(t.includes("month"))return "Monthly";
  if(t.includes("week"))return "Weekly";
  return "Other";}

// ── chart factory (verbatim from CVA design system) ──────────
function bar(id,labels,values,o={}){
  const cv=$("#"+id); if(!cv)return; if(charts[id])charts[id].destroy();
  charts[id]=new Chart(cv,{type:"bar",
    data:{labels,datasets:[{label:o.axis||"",data:values,
      backgroundColor:o.colors||PAL[0],borderRadius:2}]},
    options:{indexAxis:o.horizontal?"y":"x",responsive:true,maintainAspectRatio:false,
      onClick:(e,els)=>{if(o.onClick&&els.length)o.onClick(els[0].index);},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${o.fmt?o.fmt(c.parsed[o.horizontal?'x':'y'],c.dataIndex):c.parsed[o.horizontal?'x':'y']}`}}},
      scales:{[o.horizontal?'x':'y']:{beginAtZero:true,max:o.max,ticks:{font:{size:9},callback:o.pctAxis?(v=>v+"%"):(o.moneyAxis?(v=>v>=1e6?(v/1e6)+"M":v>=1e3?(v/1e3)+"k":v):undefined)}},
              [o.horizontal?'y':'x']:{ticks:{font:{size:9},autoSkip:!o.horizontal,maxRotation:o.horizontal?0:55}}}}});
}
function stacked(id,labels,series,o={}){

  charts[id]=new Chart(cv,{type:"bar",
    data:{labels,datasets:series.map((s,i)=>({label:s.label,data:s.data,backgroundColor:s.color||PAL[i%PAL.length]}))},
    options:{indexAxis:o.horizontal===false?"x":"y",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:10},boxWidth:12}},tooltip:{mode:"index"}},
      scales:{x:{stacked:true,ticks:{font:{size:9}}},y:{stacked:true,ticks:{font:{size:9}}}}}});
}

    options:{indexAxis:o.horizontal?"y":"x",responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{size:10},boxWidth:12}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${o.moneyAxis?ugx(c.parsed[o.horizontal?'x':'y']):c.parsed[o.horizontal?'x':'y']}${o.pctAxis?"%":""}`}}},

              [o.horizontal?'y':'x']:{ticks:{font:{size:9},maxRotation:55}}}}});
}
function doughnut(id,labels,values){
  const cv=$("#"+id); if(!cv)return; if(charts[id])charts[id].destroy();
  charts[id]=new Chart(cv,{type:"doughnut",data:{labels,datasets:[{data:values,backgroundColor:PAL}]},

function scatter(id,groups,o={}){
  const cv=$("#"+id); if(!cv)return; if(charts[id])charts[id].destroy();

              y:{title:{display:true,text:o.yt},min:0,max:o.ymax||100,ticks:{callback:v=>v+"%"}}}}});
}
function histBins(vals,step){const m={};vals.forEach(v=>{const b=Math.floor(v/step)*step;m[b]=(m[b]||0)+1;});
  const keys=Object.keys(m).map(Number).sort((a,b)=>a-b);return {labels:keys.map(k=>k+"–"+(k+step)),values:keys.map(k=>m[k])};}

function rQual(c){
  const R=filtered();
  // flatten qualitative from filtered groups (retain group context for non-sensitive only)
  const rows=[];
  R.forEach(g=>(g.qualitative||[]).forEach(q=>rows.push({q,g})));
  const themes=[...new Set(rows.map(x=>x.q.theme))].sort();
  const nSens=rows.filter(x=>x.q.sensitive).length;
  c.innerHTML=kpiRow([["Excerpts (filtered)",fmt(rows.length)],["Themes",fmt(themes.length)],

    +'<div class="block full"><h3>Excerpts by theme</h3><div class="chartbox"><canvas id="q_themebar"></canvas></div></div>'
    +'<div class="block full" style="margin-top:14px"><h3>Theme-tagged excerpts</h3>'
      +'<div class=note>Searchable, filterable insights — not raw dumps. Sensitive excerpts (GBV / welfare-attributable) are shown non-attributably: no group name or village is displayed.</div>'
      +'<div class="qbar">'
        +'<div><label>Theme</label><br><select id="q_theme"><option value="">All themes</option>'+themes.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")+'</select></div>'
        +'<div><label>Keyword search</label><br><input type="text" id="q_search" placeholder="search response text…"></div>'
        +'<div><label>&nbsp;</label><br><span class="fnote" id="q_count"></span></div>'
      +'</div><div class="exlist" id="q_list"></div></div>';
  // theme count bar
  const tc=new Map();rows.forEach(x=>tc.set(x.q.theme,(tc.get(x.q.theme)||0)+1));
  const te=[...tc.entries()].sort((a,b)=>b[1]-a[1]);
  bar("q_themebar",te.map(x=>x[0]),te.map(x=>x[1]),{colors:PAL[0]});
  function draw(){
    const th=$("#q_theme").value, kw=$("#q_search").value.trim().toLowerCase();
    const sel=rows.filter(x=>(!th||x.q.theme===th)&&(!kw||x.q.response_text.toLowerCase().includes(kw)));
    $("#q_count").textContent=`${sel.length} excerpt(s)`;
    $("#q_list").innerHTML=sel.slice(0,400).map(x=>{const q=x.q,g=x.g;
      const chips=(q.tags?q.tags.split(","):[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")+`<span class="pill" style="background:#e3f0fb;border-color:#bcd">${esc(q.theme)}</span>`;
      const ctx=q.sensitive?"":`<div class="ctx">${esc(g.group_name||"—")} · ${esc(g.village||g.parish||g.sub_county||"—")}</div>`;
      const snote=q.sensitive?'<div class="snote">Sensitive — shown non-attributably.</div>':"";
      return `<div class="excerpt${q.sensitive?" sens":""}"><div class="q">${esc(q.question_label)}</div>${ctx}<div>${chips}</div><div class="txt">${esc(q.response_text)}</div>${snote}</div>`;}).join("")
      +(sel.length>400?'<div class=note>Showing first 400 excerpts.</div>':(sel.length?"":'<div class=note>No excerpts match.</div>'));
  }
  $("#q_theme").onchange=draw;$("#q_search").oninput=draw;draw();
}

// ── inferential statistics (port of lib/analytics/stats.ts) ──
// Verbatim ports so the numbers match /api/analytics. Unlike the React panel
// this recomputes under the ACTIVE FILTER, so a sub-county view reports its own
// statistics rather than cohort-wide ones — hence the n on every card.
function erf(x){const s=x<0?-1:1,ax=Math.abs(x),t=1/(1+0.3275911*ax);
  const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-ax*ax);
  return s*y;}
const normalCdf=z=>0.5*(1+erf(z/Math.SQRT2));
const twoSidedP=z=>2*(1-normalCdf(Math.abs(z)));
function rankAverage(values){
  const idx=values.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
  const ranks=new Array(values.length);
  let i=0;
  while(i<idx.length){let j=i;
    while(j+1<idx.length&&idx[j+1].v===idx[i].v)j++;
    const avg=(i+j)/2+1;
    for(let k=i;k<=j;k++)ranks[idx[k].i]=avg;
    i=j+1;}
  return ranks;}
function spearman(x,y){
  const n=Math.min(x.length,y.length); if(n<2)return NaN;
  const rx=rankAverage(x.slice(0,n)),ry=rankAverage(y.slice(0,n));
  const mx=rx.reduce((a,b)=>a+b,0)/n,my=ry.reduce((a,b)=>a+b,0)/n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=rx[i]-mx,dy=ry[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
  const d=Math.sqrt(sxx*syy); return d===0?NaN:sxy/d;}
function mannWhitney(A,B){
  const nA=A.length,nB=B.length; if(!nA||!nB)return{u:NaN,p:NaN};
  const ranks=rankAverage([...A,...B]);
  let rs=0; for(let i=0;i<nA;i++)rs+=ranks[i];
  const uA=rs-(nA*(nA+1))/2, u=Math.min(uA,nA*nB-uA);
  const mu=(nA*nB)/2, sigma=Math.sqrt((nA*nB*(nA+nB+1))/12);
  if(sigma===0)return{u,p:NaN};
  return {u,p:twoSidedP((u-mu+0.5)/sigma)};}
const LANCZOS=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,
  -176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function logGamma(z){
  if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-logGamma(1-z);
  z-=1; let x=LANCZOS[0];
  for(let i=1;i<LANCZOS.length;i++)x+=LANCZOS[i]/(z+i);
  const t=z+LANCZOS.length-1.5;
  return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);}
const logFact=n=>logGamma(n+1);
function fisherExact(a,b,c,d){
  a=Math.max(0,Math.round(a));b=Math.max(0,Math.round(b));c=Math.max(0,Math.round(c));d=Math.max(0,Math.round(d));
  const n=a+b+c+d; if(n===0)return NaN;
  const rowA=a+b,colA=a+c,rowB=c+d,colB=b+d;
  const K=logFact(rowA)+logFact(rowB)+logFact(colA)+logFact(colB)-logFact(n);
  const pl=x=>{const xb=rowA-x,xc=colA-x,xd=rowB-xc;
    return (x<0||xb<0||xc<0||xd<0)?-Infinity:K-(logFact(x)+logFact(xb)+logFact(xc)+logFact(xd));};
  const obs=pl(a),lo=Math.max(0,colA-rowB),hi=Math.min(rowA,colA);
  let p=0; for(let x=lo;x<=hi;x++){const lp=pl(x); if(lp<=obs+1e-9)p+=Math.exp(lp);}
  return Math.min(1,p);}

// the 5 tests from app/api/analytics/route.ts, same MIN_N and skip rules
const MIN_N=5;
const smallNote=n=>`n=${n} — treat as directional, not confirmatory`;
function paired(xs,ys){const x=[],y=[];
  for(let i=0;i<xs.length;i++)if(xs[i]!=null&&ys[i]!=null){x.push(xs[i]);y.push(ys[i]);}
  return {x,y};}
function spearmanCard(label,xs,ys){
  const {x,y}=paired(xs,ys), n=x.length;
  if(n<MIN_N)return{label,skipped:true,note:`Skipped — only ${n} paired non-null observations (need ≥${MIN_N}).`};
  const rho=spearman(x,y);
  return {label,stat:`Spearman ρ = <strong>${isNaN(rho)?"—":(Math.round(rho*1000)/1000)}</strong> (n=${n})`,note:smallNote(n)};}
function buildInferences(R){
  const gAge=R.map(g=>g.group_age_months==null?null:+g.group_age_months);
  const savPM=R.map(g=>mval(g).avg_savings_per_member??null);
  const out=[
    spearmanCard("Group age vs average savings per member",gAge,savPM),
    spearmanCard("Leadership completeness vs repayment rate",
      R.map(g=>rval(g).leadershipCompleteness??null),R.map(g=>mval(g).repayment_rate??null)),
    spearmanCard("Gender leadership ratio vs social-welfare-fund ratio",
      R.map(g=>rval(g).genderLeadershipRatio??null),R.map(g=>rval(g).swfRatio??null))];
  // Mann–Whitney: savings per member split by institutional linkage
  const lk=[],nlk=[];
  R.forEach(g=>{const v=mval(g).avg_savings_per_member,l=mval(g).linked_fin_institution;
    if(v==null)return; if(l===true)lk.push(v); else if(l===false)nlk.push(v);});
  const mwN=lk.length+nlk.length;
  const mwLabel="Average savings per member — linked vs not linked to a financial institution";
  if(lk.length<3||nlk.length<3||mwN<MIN_N)
    out.push({label:mwLabel,skipped:true,note:`Skipped — group sizes (linked=${lk.length}, not-linked=${nlk.length}) too small.`});
  else{const {u,p}=mannWhitney(lk,nlk);
    out.push({label:mwLabel,stat:`Mann–Whitney U = <strong>${u}</strong>, p ≈ <strong>${isNaN(p)?"—":(Math.round(p*1000)/1000)}</strong><br>(linked=${lk.length}, not-linked=${nlk.length})`,note:smallNote(mwN)});}
  // Fisher's exact: fair interest rates × formally registered
  let a=0,b=0,c=0,d=0,fn=0;
  R.forEach(g=>{const f=mval(g).interest_fair,r=mval(g).formally_registered;
    if(f==null||r==null)return; fn++;
    if(f&&r)a++; else if(f&&!r)b++; else if(!f&&r)c++; else d++;});
  const fLabel="Fair interest rates × formally registered";
  if(fn<MIN_N)out.push({label:fLabel,skipped:true,note:`Skipped — only ${fn} groups answered both questions (need ≥${MIN_N}).`});
  else{const p=fisherExact(a,b,c,d);
    out.push({label:fLabel,stat:`Fisher's exact p = <strong>${isNaN(p)?"—":(Math.round(p*1000)/1000)}</strong> (n=${fn})`,note:smallNote(fn)});}
  return out;}

// ── Performance Ratios ───────────────────────────────────────
// Diverging sign colours: blue = above zero, orange = below, grey = ~zero.
// Blue/orange (not green/red) because green↔red separate by only ΔE 4.2 under
// deuteranopia; this pair clears 25.4. Sign is also carried by position about the
// zero baseline and by the tooltip, so colour is never the only cue.
const DIV_POS=PAL[2], DIV_NEG=PAL[3], DIV_ZERO="#bdbdbd";
const signCols=vals=>vals.map(v=>v==null?DIV_ZERO:v>0.0005?DIV_POS:v<-0.0005?DIV_NEG:DIV_ZERO);
const r2=v=>v==null||isNaN(v)?"—":(Math.round(v*100)/100).toLocaleString();
const rpc=v=>v==null||isNaN(v)?"—":(v*100).toFixed(1)+"%";
const rsign=v=>v==null||isNaN(v)?"—":(v>0?"+":"")+(v*100).toFixed(1)+"%";

function rRatios(c){
  const R=filtered();
  const nComplete=R.filter(g=>rval(g).leadershipCompleteness===1).length;
  const cards=[
    ["Median maturity score",(medR(R,"maturityScore")==null?"—":(medR(R,"maturityScore")>0?"+":"")+medR(R,"maturityScore").toFixed(2)),"z-score composite"],
    ["Median savings mobilisation",r2(medR(R,"savingsMobilizationRatio")),"× one share per member"],
    ["Median loan-to-savings",r2(medR(R,"loanToSavingsRatio")),"1.0 = loans equal savings"],
    ["Median retention",rpc(medR(R,"retentionRate")),"1 − dropped ÷ at formation"],
    ["Median membership growth",rsign(medR(R,"growthRate")),"vs size at formation"],
    ["Leadership complete",`${fmt(nComplete)} / ${fmt(R.length)}`,"all 8 roles staffed"]];
  c.innerHTML=kpiRow(cards)+'<div class="grid">'
    +chartCard("rt_mat","Group maturity score (z-score composite)","Mean of each group's available z-scores across savings mobilisation, leadership completeness, retention and welfare-fund ratio. Blue = above the cohort average, orange = below. Click a bar for the group.",true)
    +chartCard("rt_growth","Membership growth since formation (%)","(active − at formation) ÷ at formation. Blue = grew, orange = shrank. Retention is reported separately, so shrinkage here is net of both dropout and recruitment.",true)
    +chartCard("rt_savmob","Savings mobilisation ratio by group","Total savings ÷ (active members × share value) — how many times over the group has saved one share per member. Unbounded above; a low value can mean a high share price rather than weak saving.",true)
    +chartCard("rt_swf","Welfare fund as a share of total savings","Welfare-fund balance ÷ total savings. Values above 1.0 are flagged below — the fund cannot exceed total savings, so those are data-entry errors.",true)
    +chartCard("rt_incl","Inclusion ratios by group","Women among filled leadership seats, and youth among active members.",true)
    +'<div class="block full"><h3>Exploratory Insights</h3><div class="insights" id="rt_inf"></div>'
      +'<div class=note>Small-sample exploratory statistics — <strong>directional only</strong>, never confirmatory. Unlike the old platform panel these recompute under the filters above, so each card states its own n; narrowing the filter can push a test below its minimum and skip it.</div></div>'
    +'<div class="block full"><h3>Per-group ratio table</h3><div class="tablebox" id="rt_tbl"></div>'
      +'<div class=note>All ten ratios as served by <code>/api/analytics</code>. A guarded denominator (zero or missing) yields “—”, never a spurious zero.</div></div>'
    +'</div>';
  // exploratory insights (recomputed for the current filter)
  $("#rt_inf").innerHTML=buildInferences(R).map(inf=>
    `<div class="insight${inf.skipped?" skip":""}"><div class="il">${esc(inf.label)}</div>`
    +`<div class="is">${inf.skipped?"Not computed.":inf.stat}</div>`
    +`<div class="ic">⚠ ${esc(inf.note)}</div></div>`).join("");

  // maturity score — diverging about the cohort mean
  const gm=ratioRanked(R,"maturityScore");
  bar("rt_mat",gm.map(glab),gm.map(g=>+rval(g).maturityScore.toFixed(3)),
    {horizontal:true,colors:signCols(gm.map(g=>rval(g).maturityScore)),
     fmt:v=>(v>0?"+":"")+v.toFixed(3),onClick:i=>openGroups([gm[i]],gm[i].group_name)});
  // membership growth — diverging about zero
  const gg=ratioRanked(R,"growthRate");
  bar("rt_growth",gg.map(glab),gg.map(g=>+(rval(g).growthRate*100).toFixed(1)),
    {horizontal:true,pctAxis:true,colors:signCols(gg.map(g=>rval(g).growthRate)),
     fmt:v=>(v>0?"+":"")+v+"%",onClick:i=>openGroups([gg[i]],gg[i].group_name)});
  // savings mobilisation — magnitude, single hue
  const gs=ratioRanked(R,"savingsMobilizationRatio");
  bar("rt_savmob",gs.map(glab),gs.map(g=>+rval(g).savingsMobilizationRatio.toFixed(2)),
    {horizontal:true,colors:PAL[0],fmt:v=>v+"×",onClick:i=>openGroups([gs[i]],gs[i].group_name)});
  // welfare-fund share — magnitude, single hue; >1.0 impossible
  const gw=ratioRanked(R,"swfRatio");
  bar("rt_swf",gw.map(glab),gw.map(g=>+(rval(g).swfRatio*100).toFixed(1)),
    {horizontal:true,pctAxis:true,colors:PAL[0],fmt:v=>v+"%",onClick:i=>openGroups([gw[i]],gw[i].group_name)});
  const impossible=gw.filter(g=>rval(g).swfRatio>1);
  if(impossible.length)$("#rt_swf").closest(".block").querySelector(".note").innerHTML+=
    ` <strong>${fmt(impossible.length)} group(s) above 1.0:</strong> ${impossible.map(g=>esc(g.group_name||"#"+g.kobo_id)).join(", ")}.`;
  // inclusion — two series, legend shown by groupedBar
  const gi=R.filter(g=>rval(g).genderLeadershipRatio!=null||rval(g).youthInclusionRatio!=null)
    .sort((a,b)=>(rval(b).genderLeadershipRatio||0)-(rval(a).genderLeadershipRatio||0));
  groupedBar("rt_incl",gi.map(glab),[
    {label:"Women in leadership",color:PAL[0],data:gi.map(g=>rval(g).genderLeadershipRatio==null?null:+(rval(g).genderLeadershipRatio*100).toFixed(1))},
    {label:"Youth among active",color:PAL[2],data:gi.map(g=>rval(g).youthInclusionRatio==null?null:+(rval(g).youthInclusionRatio*100).toFixed(1))}],
    {horizontal:true,pctAxis:true,max:100});
  // table view — every ratio, guarded nulls as em dashes
  const head="<tr><th>Group</th><th class=num>Maturity</th><th class=num>Sav. mobil.</th><th class=num>Loan/sav.</th><th class=num>PAR proxy</th><th class=num>Welfare/sav.</th><th class=num>Leadership</th><th class=num>Women lead.</th><th class=num>Youth</th><th class=num>Retention</th><th class=num>Growth</th></tr>";
  const body=ratioRanked(R,"maturityScore").concat(R.filter(g=>rval(g).maturityScore==null))
    .map(g=>{const r=rval(g);
      return `<tr><td>${esc(g.group_name||"—")}</td>`
        +`<td class=num>${r.maturityScore==null?"—":(r.maturityScore>0?"+":"")+r.maturityScore.toFixed(3)}</td>`
        +`<td class=num>${r2(r.savingsMobilizationRatio)}</td><td class=num>${r2(r.loanToSavingsRatio)}</td>`
        +`<td class=num>${r.portfolioAtRiskProxy==null?"—":r.portfolioAtRiskProxy.toFixed(4)}</td>`
        +`<td class=num>${rpc(r.swfRatio)}</td><td class=num>${rpc(r.leadershipCompleteness)}</td>`
        +`<td class=num>${rpc(r.genderLeadershipRatio)}</td><td class=num>${rpc(r.youthInclusionRatio)}</td>`
        +`<td class=num>${rpc(r.retentionRate)}</td><td class=num>${rsign(r.growthRate)}</td></tr>`;}).join("");
  $("#rt_tbl").innerHTML=`<table>${head}${body}</table>`;
}

// ═══════════════ sections + nav ═══════════════
const SECTIONS=[
  {id:"overview",title:"Overview",desc:"Programme-wide performance at a glance: membership, savings, loans, repayment, retention, governance, welfare and self-sufficiency across all VSLAs.",render:rOverview},
  {id:"ratios",title:"Performance Ratios",desc:"The ten derived performance ratios — savings mobilisation, loan-to-savings, portfolio-at-risk proxy, welfare-fund share, leadership completeness, women in leadership, youth inclusion, retention, membership growth and a maturity z-score composite. Identical to the values /api/analytics serves; every denominator is guarded, so a missing or zero divisor shows as “—” rather than a misleading zero. Also hosts the Exploratory Insights (Spearman / Mann–Whitney / Fisher's exact) that previously sat on the platform /dashboard page — here they recompute under the filters above.",render:rRatios},
  {id:"membership",title:"Membership & Inclusion",desc:"Growth and attrition since formation, gender / youth / PWD composition, meeting attendance and financial-training coverage.",render:rMembership},
  {id:"governance",title:"Governance",desc:"Leadership completeness, women & youth in leadership, and constitution / record-keeping compliance built from the governance indicators.",render:rGovernance},
  {id:"savings",title:"Savings & Loans",desc:"Savings and loan volumes, repayment vs default, interest-rate spread and a per-group benchmarking table with data-quality flags on out-of-range rates.",render:rSavings},
  {id:"welfare",title:"Social Welfare Fund",desc:"Welfare-fund adoption, size and share of savings, beneficiary reach, and the needs the fund typically addresses (from tagged qualitative responses).",render:rWelfare},
  {id:"linkage",title:"Institutional Linkage",desc:"Links to financial institutions, bank accounts, formal registration, local-government collaboration and the Parish Development Model (PDM).",render:rLinkage},
  {id:"outcomes",title:"Outcomes & Sustainability",desc:"Business creation, self-sufficiency, spin-off VSLAs, growth-plan adoption and reported member-level outcomes.",render:rOutcomes},
  {id:"qualitative",title:"Qualitative Insights",desc:"Theme-tagged, searchable excerpts from the free-text responses. Sensitive (GBV / welfare-attributable) content is shown only in non-attributable form.",render:rQual},
  {id:"geography",title:"Geography",desc:"Sub-county, parish and village comparison of group counts and key aggregate metrics. This form carries no GPS, so no map is shown.",render:rGeography},
];
let active=SECTIONS[0].id;
function renderActive(){
  const sec=SECTIONS.find(s=>s.id===active);
  const R=filtered();
  const wrap=$("#secwrap");
  wrap.innerHTML=`<div class="sec-title">${sec.title}</div><div class="sec-desc">${sec.desc}</div><div id="secbody"></div>`
    +`<div class="footer">Source: KoBoToolbox form <code>${META.form_uid}</code> · ${fmt(META.n)} VSLA groups (${fmt(R.length)} in current filter) · ${META.country} · ${META.date_min}→${META.date_max} · currency UGX · generated ${esc(META.generated)}. Global filters apply across every tab.</div>`;
  $("#hdrsub").textContent=`${fmt(R.length)} / ${fmt(META.n)} groups · ${META.country} · ${META.date_min}→${META.date_max}`;
  sec.render($("#secbody"));
}
function show(id){active=id;document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.dataset.id===id));window.scrollTo(0,0);
  for(const k in charts){charts[k].destroy();delete charts[k];} renderActive();}

// ── filters UI (sub-county → parish → village cascade + date range) ──
function buildFilters(){
  const fb=$("#filters");
  fb.innerHTML=`
    <div><label>Sub-county</label><br><select id="flt_sc"></select></div>
    <div><label>Parish</label><br><select id="flt_pa"></select></div>
    <div><label>Village</label><br><select id="flt_vi"></select></div>
    <div><label>Assessment from</label><br><input type="date" id="flt_from"></div>
    <div><label>Assessment to</label><br><input type="date" id="flt_to"></div>
    <div><label>&nbsp;</label><br><button id="flt_clear">Clear filters</button></div>
    <div class="fnote">Global filters — apply across every tab.</div>`;
  function fillSelect(sel,vals,cur){sel.innerHTML='<option value="">All</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if(cur&&vals.includes(cur))sel.value=cur;}
  function rebuild(){
    const scs=[...new Set(GROUPS.map(g=>g.sub_county).filter(Boolean))].sort();
    fillSelect($("#flt_sc"),scs,F.sc);
    const paPool=GROUPS.filter(g=>!F.sc||g.sub_county===F.sc);
    const pas=[...new Set(paPool.map(g=>g.parish).filter(Boolean))].sort();
    if(F.pa&&!pas.includes(F.pa))F.pa=null;
    fillSelect($("#flt_pa"),pas,F.pa);
    const viPool=paPool.filter(g=>!F.pa||g.parish===F.pa);
    const vis=[...new Set(viPool.map(g=>g.village).filter(Boolean))].sort();
    if(F.vi&&!vis.includes(F.vi))F.vi=null;
    fillSelect($("#flt_vi"),vis,F.vi);
  }
  rebuild();
  $("#flt_sc").onchange=e=>{F.sc=e.target.value||null;F.pa=null;F.vi=null;rebuild();renderActive();};
  $("#flt_pa").onchange=e=>{F.pa=e.target.value||null;F.vi=null;rebuild();renderActive();};
  $("#flt_vi").onchange=e=>{F.vi=e.target.value||null;renderActive();};
  $("#flt_from").onchange=e=>{F.from=e.target.value||null;renderActive();};
  $("#flt_to").onchange=e=>{F.to=e.target.value||null;renderActive();};
  $("#flt_clear").onclick=()=>{Object.keys(F).forEach(k=>F[k]=null);$("#flt_from").value="";$("#flt_to").value="";rebuild();renderActive();};
}

// ── boot ─────────────────────────────────────────────────────
function boot(){
  const nav=$("#nav");
  SECTIONS.forEach(s=>{const a=el("a",s.id===active?"active":"",s.title);a.dataset.id=s.id;a.onclick=()=>show(s.id);nav.appendChild(a);});
  buildFilters();
  renderActive();
}
boot();
</script>
